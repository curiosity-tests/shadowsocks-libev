name: tests

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input so racecar can drive the run and pick
#      baseline vs instrumented.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action; `chalk:` is the only variable separating the arms.
#   3. permissions: id-token: write for the action's OIDC connect (the block
#      zeroes unlisted scopes, so everything upstream relied on is restated).
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      leaving fail-fast on cancels instrumented siblings more often than
#      baseline ones and biases the comparison.
#   6. the concurrency group carries the leg. Both arms run on the same ref, so
#      upstream's github.ref-keyed group put them in one group and the second
#      dispatch cancelled the first. Also cancellation-only, never a build change.
# Build and test COMMANDS are unchanged from upstream.

run-name: "tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  id-token: write

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: recursive

      - name: Assert instrumentation is live
        # Socket existence, not LD_PRELOAD: co-monitor's loader clears
        # LD_PRELOAD once it has injected, so an empty value is what success
        # looks like. co-hostd also daemonizes, so pgrep does not match it.
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }


      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev libmbedtls-dev libsodium-dev libev-dev libc-ares-dev valgrind

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install mbedtls@3 libsodium libev c-ares pcre2

      - name: Build test binaries
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu)"
          make -j"$jobs"

      - name: CTest
        run: ctest --test-dir build -LE memcheck --output-on-failure --no-tests=error

      - name: Valgrind leak smoke tests
        if: runner.os == 'Linux'
        run: ctest --test-dir build -L memcheck --output-on-failure --no-tests=error

      - name: ss-setup TUI tests
        run: bash tests/test_ss_setup.sh

      - name: Stress test
        run: |
          python3 tests/stress_test.py --bin build/shared/bin/ --size 10

      - name: ss-redir transparent proxy test (QEMU)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y qemu-system-x86
          bash tests/test_redir_qemu.sh build/shared/bin/
        timeout-minutes: 8

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: recursive

      - name: Assert instrumentation is live
        # Socket existence, not LD_PRELOAD: co-monitor's loader clears
        # LD_PRELOAD once it has injected, so an empty value is what success
        # looks like. co-hostd also daemonizes, so pgrep does not match it.
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev libmbedtls-dev libsodium-dev libev-dev libc-ares-dev

      - name: Build with ASan + UBSan
        run: |
          mkdir -p build && cd build
          cmake .. -DENABLE_SANITIZERS=ON
          make -j"$(nproc)"

      - name: CTest (ASan + UBSan)
        run: ctest --test-dir build -LE memcheck --output-on-failure --no-tests=error

      - name: Stress test (ASan + UBSan)
        run: python3 tests/stress_test.py --bin build/shared/bin/ --size 10

  clang-tidy:
    runs-on: ubuntu-latest
    env:
      # Ratchet: number of known clang-tidy warnings (see .clang-tidy),
      # counted with clang-tidy-18 (pinned below so runner upgrades don't move
      # the number). All baseline findings have been fixed or triaged
      # (false positives carry NOLINT comments with rationale), so any new
      # warning fails CI.
      MAX_WARNINGS: 0
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: recursive

      - name: Assert instrumentation is live
        # Socket existence, not LD_PRELOAD: co-monitor's loader clears
        # LD_PRELOAD once it has injected, so an empty value is what success
        # looks like. co-hostd also daemonizes, so pgrep does not match it.
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 clang-tools-18 libpcre2-dev libmbedtls-dev libsodium-dev libev-dev libc-ares-dev

      - name: Configure (compile_commands.json)
        run: cmake -S . -B build

      - name: Run clang-tidy on project sources
        run: |
          run-clang-tidy-18 -quiet -p build '/src/[^/]+\.c$' 2>/dev/null | tee tidy.log || true
          grep 'warning:' tidy.log | sort -u > warnings.txt || true
          count="$(wc -l < warnings.txt)"
          echo "clang-tidy warnings: $count (max allowed: $MAX_WARNINGS)"
          {
            echo "### clang-tidy: $count warnings (budget: $MAX_WARNINGS)"
            echo '```'
            cat warnings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q . warnings.txt && grep -qE 'error:' tidy.log; then
            echo "clang-tidy produced errors:"; grep -E 'error:' tidy.log | sort -u
            exit 1
          fi
          if [ "$count" -gt "$MAX_WARNINGS" ]; then
            echo "FAIL: warning count $count exceeds budget $MAX_WARNINGS."
            echo "Fix the new warnings (or, if a check is misfiring, adjust .clang-tidy)."
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
          submodules: recursive

      - name: Assert instrumentation is live
        # Socket existence, not LD_PRELOAD: co-monitor's loader clears
        # LD_PRELOAD once it has injected, so an empty value is what success
        # looks like. co-hostd also daemonizes, so pgrep does not match it.
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov libpcre2-dev libmbedtls-dev libsodium-dev libev-dev libc-ares-dev

      - name: Build with coverage instrumentation
        run: |
          mkdir -p build && cd build
          cmake .. -DENABLE_COVERAGE=ON
          make -j"$(nproc)"

      - name: Run tests
        run: |
          ctest --test-dir build -LE memcheck --output-on-failure --no-tests=error
          python3 tests/stress_test.py --bin build/shared/bin/ --size 10

      - name: Generate coverage report
        run: |
          cmake --build build --target coverage
          {
            echo '### Coverage (src/, unit + stress tests)'
            echo '```'
            lcov --list build/coverage.info --ignore-errors unused,empty
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage-html/
